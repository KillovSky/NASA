name: Publish Package to npmjs

# Publica no npm sempre que uma release do GitHub é publicada.
# A versão publicada é a que estiver em package.json no momento da release
on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # necessário para provenance (npm publish --provenance)

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package version matches release tag
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_NAME="${{ github.event.release.tag_name }}"
          if [ "$PKG_VERSION" != "$TAG_NAME" ]; then
            echo "::error::Versão em package.json ($PKG_VERSION) não bate com a tag da release ($TAG_NAME)."
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
